<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sensei – Vocabulary</title>
<script>try{var t=localStorage.getItem("sensei-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14B8A6">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sensei">
<style>
  :root {
    --teal: #14B8A6;
    --teal-dark: #0F9E8E;
    --teal-light: #F0FDFA;
    --bg: #F5F5F4;
    --surface: #fff;
    --border: #E7E5E4;
    --text: #1C1917;
    --muted: #78716C;
    --gray-btn: #E7E5E4;
    --amber: #D97706;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 720px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .title { display: flex; align-items: center; gap: 12px; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--teal); color: #fff;
    display: grid; place-items: center;
    font-weight: 700; font-size: 18px;
  }
  .name { font-weight: 600; font-size: 17px; }
  .sub { font-size: 13px; color: var(--muted); }
  .reset-btn {
    border: 1px solid var(--border); color: var(--muted); background: var(--surface);
    padding: 8px 12px; border-radius: 999px; font-size: 13px; font-weight: 600;
    cursor: pointer;
  }
  .reset-btn:hover { border-color: var(--muted); color: var(--text); }

  /* Topic tabs */
  .topics {
    display: flex; gap: 8px;
    padding: 12px 16px 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .topics::-webkit-scrollbar { display: none; }
  .topic {
    flex: none;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    padding: 8px 16px; border-radius: 999px; font-size: 14px; font-weight: 600;
    cursor: pointer;
  }
  .topic.active { background: var(--teal); border-color: var(--teal); color: #fff; }

  /* Progress */
  .progress { padding: 12px 16px 4px; }
  .progress-label {
    display: flex; justify-content: space-between;
    font-size: 13px; color: var(--muted); margin-bottom: 6px;
  }
  .progress-label strong { color: var(--text); }
  .bar { height: 8px; background: var(--border); border-radius: 999px; overflow: hidden; }
  .bar-fill {
    height: 100%; width: 0; background: var(--teal); border-radius: 999px;
    transition: width 0.4s ease;
  }

  /* Card grid */
  .content { flex: 1; overflow-y: auto; padding: 12px 16px 24px; }
  .hint { font-size: 13px; color: var(--muted); margin-bottom: 12px; text-align: center; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
  }
  .slot { display: flex; flex-direction: column; gap: 8px; }

  .card {
    height: 210px;
    perspective: 1000px;
    cursor: pointer;
    border-radius: 16px;
    outline: none;
  }
  .card:focus-visible .face { box-shadow: 0 0 0 3px var(--teal); }
  .card-inner {
    position: relative; width: 100%; height: 100%;
    transition: transform 0.6s;
    transform-style: preserve-3d;
  }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 14px; text-align: center;
  }
  .front .word { font-size: 24px; font-weight: 700; line-height: 1.2; }
  .front .tap { position: absolute; bottom: 12px; font-size: 12px; color: var(--muted); }
  .badge {
    position: absolute; top: 10px; right: 10px;
    font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px;
  }
  .badge.known { background: var(--teal-light); color: var(--teal-dark); }
  .badge.learning { background: #FEF3C7; color: var(--amber); }
  .card.known .front { border-color: var(--teal); }

  .speak {
    position: absolute; top: 8px; left: 8px;
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--bg);
    font-size: 16px; line-height: 1; cursor: pointer;
    display: grid; place-items: center;
  }
  .speak:hover { border-color: var(--teal); background: var(--teal-light); }
  .speak:focus-visible { outline: 3px solid var(--teal); outline-offset: 1px; }
  .speak.speaking { border-color: var(--teal); background: var(--teal-light); animation: pulse 0.8s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.1); } }

  .back {
    transform: rotateY(180deg);
    background: var(--teal-light);
    border-color: var(--teal);
    gap: 8px;
  }
  .back .jp { font-size: 20px; font-weight: 700; color: var(--teal-dark); }
  .back .example { font-size: 13px; line-height: 1.4; font-style: italic; }
  .back .pron { font-size: 12px; color: var(--muted); }
  .back .pron b { color: var(--text); }

  .actions {
    display: flex; flex-direction: column; gap: 6px;
    visibility: hidden; opacity: 0;
    transition: opacity 0.3s;
  }
  .slot.open .actions { visibility: visible; opacity: 1; }
  .actions button {
    border: none; border-radius: 10px; padding: 9px 8px;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .know { background: var(--teal); color: #fff; }
  .know:hover { background: var(--teal-dark); }
  .learn { background: var(--gray-btn); color: var(--text); }
  .learn:hover { background: #D6D3D1; }

  [hidden] { display: none !important; }

  /* Review mode */
  .review-btn {
    margin-top: 10px; width: 100%;
    border: 1.5px solid var(--teal); background: var(--surface); color: var(--teal-dark);
    padding: 9px 12px; border-radius: 999px; font-size: 14px; font-weight: 600;
    cursor: pointer;
  }
  .review-btn:hover { background: var(--teal-light); }
  .review { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .review-bar {
    width: 100%; max-width: 300px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 14px; color: var(--muted); font-weight: 600;
  }
  .exit-btn {
    border: none; background: none; color: var(--muted);
    font-size: 14px; font-weight: 600; cursor: pointer; padding: 6px;
  }
  .exit-btn:hover { color: var(--text); }
  .review-box { width: 100%; max-width: 300px; }
  .review-box .card { height: 280px; }
  .review-box .front .word { font-size: 32px; }
  .review-box .back .jp { font-size: 26px; }
  .review-box .back .example { font-size: 15px; }
  .review-box .actions { flex-direction: row; }
  .review-box .actions button { flex: 1; padding: 12px 8px; font-size: 14px; }

  .toast {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
    background: var(--text); color: #fff; padding: 10px 16px; border-radius: 999px;
    font-size: 14px; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { opacity: 1; }

  /* Navigation: bottom tab bar on mobile, top bar on wider screens */
  .tabbar { display: flex; background: var(--surface); border-top: 1px solid var(--border); }
  .tabbar a {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
    font-size: 12px; font-weight: 600; color: var(--muted); text-decoration: none;
  }
  .tabbar a.active { color: var(--teal); }
  @media (min-width: 641px) {
    .tabbar {
      order: -1; justify-content: center; gap: 8px; padding: 8px;
      border-top: none; border-bottom: 1px solid var(--border);
    }
    .tabbar a { flex: none; flex-direction: row; gap: 8px; padding: 8px 16px; font-size: 14px; border-radius: 999px; }
    .tabbar a.active { background: var(--teal-light); }
  }
</style>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="app">
  <header>
    <div class="title">
      <div class="avatar">S</div>
      <div>
        <div class="name">Vocabulary</div>
        <div class="sub">Tap a card to see the answer</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="reset-btn" id="reset" type="button">Reset Progress</button>
      <span data-theme-toggle></span>
    </div>
  </header>

  <div class="topics" id="topics" role="tablist"></div>

  <div class="progress">
    <div class="progress-label">
      <span id="progressText"><strong>0 of 0</strong> words known</span>
      <span id="progressPct">0%</span>
    </div>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    <button type="button" class="review-btn" id="reviewBtn">▶ Review</button>
  </div>

  <main class="content">
    <div class="grid" id="grid"></div>
    <section class="review" id="review" hidden>
      <div class="review-bar">
        <span id="reviewCount">Card 1 of 1</span>
        <button type="button" class="exit-btn" id="exitReview">✕ Exit review</button>
      </div>
      <div class="review-box" id="reviewBox"></div>
    </section>
  </main>

  <nav class="tabbar" data-active="vocab"></nav>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="shared.js"></script>
<script>
  // VOCAB (the word list) lives in shared.js
  const STORE_KEY = SENSEI_KEYS.vocab;
  const TAB_KEY = "sensei-vocab-tab";

  // Saved results: { "Greetings::Hello": "known" | "learning" }
  function loadProgress() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
    catch (e) { return {}; }
  }
  function saveProgress() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); } catch (e) {}
  }
  function loadTab() {
    try { const t = localStorage.getItem(TAB_KEY); return VOCAB[t] ? t : null; }
    catch (e) { return null; }
  }
  function saveTab(t) {
    try { localStorage.setItem(TAB_KEY, t); } catch (e) {}
  }

  let progress = loadProgress();
  let currentTopic = loadTab() || "Greetings";

  const topicsEl = document.getElementById("topics");
  const grid = document.getElementById("grid");
  const toast = document.getElementById("toast");
  const reviewEl = document.getElementById("review");
  const reviewBox = document.getElementById("reviewBox");
  const reviewCount = document.getElementById("reviewCount");
  const reviewBtn = document.getElementById("reviewBtn");

  const keyFor = (topic, word) => topic + "::" + word;

  function renderTabs() {
    topicsEl.innerHTML = "";
    Object.keys(VOCAB).forEach(topic => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "topic" + (topic === currentTopic ? " active" : "");
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", topic === currentTopic);
      b.textContent = topic;
      b.onclick = () => {
        currentTopic = topic;
        saveTab(topic);
        renderTabs();
        renderCards();
      };
      topicsEl.appendChild(b);
    });
  }

  function renderProgress() {
    const words = VOCAB[currentTopic];
    const known = words.filter(w => progress[keyFor(currentTopic, w.en)] === "known").length;
    const pct = Math.round((known / words.length) * 100);
    document.getElementById("progressText").innerHTML =
      "<strong>" + known + " of " + words.length + "</strong> words known";
    document.getElementById("progressPct").textContent = pct + "%";
    document.getElementById("barFill").style.width = pct + "%";
  }

  function badgeHTML(status) {
    if (status === "known") return '<span class="badge known">✓ Known</span>';
    if (status === "learning") return '<span class="badge learning">Learning</span>';
    return "";
  }

  // Read a word aloud with the browser's built-in speech (Web Speech API)
  const canSpeak = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;

  function pickVoice() {
    const voices = speechSynthesis.getVoices();
    return voices.find(v => v.lang === "en-US" && v.localService) ||
           voices.find(v => v.lang === "en-US") ||
           voices.find(v => v.lang && v.lang.startsWith("en")) ||
           null;
  }

  function speak(text, button) {
    if (!canSpeak) return;
    speechSynthesis.cancel(); // stop any word that is still playing
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "en-US";
    utter.rate = 0.85;        // slightly slow for learners
    const voice = pickVoice();
    if (voice) utter.voice = voice;
    if (button) {
      button.classList.add("speaking");
      const done = () => button.classList.remove("speaking");
      utter.onend = done;
      utter.onerror = done;
    }
    speechSynthesis.speak(utter);
  }

  // Some browsers (Chrome) load voices a moment after the page opens
  if (canSpeak) {
    speechSynthesis.getVoices();
    speechSynthesis.addEventListener?.("voiceschanged", () => speechSynthesis.getVoices());
  }

  // ---------- Card status & sorting ----------
  function statusOf(i) {
    return progress[keyFor(currentTopic, VOCAB[currentTopic][i].en)]; // "learning" | "known" | undefined
  }
  // Grid order: Still Learning first, then new (not rated yet), then Known last
  function rank(status) {
    return status === "learning" ? 0 : status === "known" ? 2 : 1;
  }

  let order = []; // word indexes in the order shown in the grid

  function setBadge(slot, status) {
    const front = slot.querySelector(".front");
    front.querySelector(".badge")?.remove();
    front.insertAdjacentHTML("afterbegin", badgeHTML(status));
    slot.querySelector(".card").classList.toggle("known", status === "known");
  }

  // One flashcard + its Know It / Still Learning buttons
  function buildSlot(w, i, handlers) {
    const status = statusOf(i);
    const slot = document.createElement("div");
    slot.className = "slot";
    slot.dataset.index = i;
    slot.innerHTML = `
      <div class="card ${status === "known" ? "known" : ""}" tabindex="0" role="button"
           aria-label="Flashcard: ${w.en}. Press to flip.">
        <div class="card-inner">
          <div class="face front">
            ${badgeHTML(status)}
            ${canSpeak ? `<button type="button" class="speak" aria-label="Listen to ${w.en}" title="Listen">🔊</button>` : ""}
            <div class="word">${w.en}</div>
            <div class="tap">Tap to flip</div>
          </div>
          <div class="face back">
            <div class="jp" lang="ja">${w.jp}</div>
            <div class="example">"${w.example}"</div>
            <div class="pron">Say: <b>${w.pron}</b></div>
          </div>
        </div>
      </div>
      <div class="actions">
        <button type="button" class="know">Know It ✓</button>
        <button type="button" class="learn">Still Learning</button>
      </div>`;

    const card = slot.querySelector(".card");
    card.addEventListener("click", handlers.toggle);
    card.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); handlers.toggle(); }
    });
    const speakBtn = slot.querySelector(".speak");
    if (speakBtn) {
      // Stop the click/keypress from also flipping the card
      speakBtn.addEventListener("click", e => { e.stopPropagation(); speak(w.en, speakBtn); });
      speakBtn.addEventListener("keydown", e => e.stopPropagation());
    }
    slot.querySelector(".know").addEventListener("click", handlers.know);
    slot.querySelector(".learn").addEventListener("click", handlers.learn);
    return slot;
  }

  // ---------- Grid view ----------
  function renderCards() {
    review = null;
    reviewEl.hidden = true;
    grid.hidden = false;

    const words = VOCAB[currentTopic];
    // Sorted once when the topic opens (cards don't jump around while studying)
    order = words.map((_, i) => i)
      .sort((a, b) => rank(statusOf(a)) - rank(statusOf(b)) || a - b);

    grid.innerHTML = "";
    order.forEach(i => {
      grid.appendChild(buildSlot(words[i], i, {
        toggle: () => toggleCard(i),
        know: () => mark(i, "known"),
        learn: () => mark(i, "learning")
      }));
    });
    renderProgress();
    updateReviewButton();
  }

  function slotAt(i) {
    return grid.querySelector('.slot[data-index="' + i + '"]');
  }

  function openCard(i) {
    grid.querySelectorAll(".slot").forEach(s => {
      s.classList.remove("open");
      s.querySelector(".card").classList.remove("flipped");
    });
    const slot = slotAt(i);
    if (!slot) return;
    slot.classList.add("open");
    slot.querySelector(".card").classList.add("flipped");
  }

  function closeCard(i) {
    const slot = slotAt(i);
    if (!slot) return;
    slot.classList.remove("open");
    slot.querySelector(".card").classList.remove("flipped");
  }

  function toggleCard(i) {
    const slot = slotAt(i);
    if (slot.classList.contains("open")) closeCard(i);
    else openCard(i);
  }

  function saveResult(i, result) {
    progress[keyFor(currentTopic, VOCAB[currentTopic][i].en)] = result;
    saveProgress();
    senseiRecordActivity();
    senseiWrite(SENSEI_KEYS.lastTopic, { topic: currentTopic, at: Date.now() });
    renderProgress();
    updateReviewButton();
  }

  function knownCount() {
    return VOCAB[currentTopic].filter((_, i) => statusOf(i) === "known").length;
  }

  function mark(i, result) {
    saveResult(i, result);
    setBadge(slotAt(i), result);
    closeCard(i);

    // Move to the next card in the grid's (sorted) order
    const next = order[order.indexOf(i) + 1];
    if (next !== undefined) {
      setTimeout(() => {
        openCard(next);
        const nextSlot = slotAt(next);
        nextSlot.scrollIntoView({ behavior: "smooth", block: "nearest" });
        nextSlot.querySelector(".card").focus({ preventScroll: true });
      }, 350);
    } else {
      const total = VOCAB[currentTopic].length;
      showToast(knownCount() === total
        ? "Amazing! You know all the " + currentTopic + " words ✨"
        : "You finished " + currentTopic + "! Press Review to practice again.");
    }
  }

  // ---------- Review mode (basic spaced repetition) ----------
  // How many times each card appears in one review session.
  // "Still Learning" cards appear 3x as often as "Known" cards.
  const REVIEW_WEIGHTS = { learning: 3, new: 2, known: 1 };

  let review = null; // { queue: [word indexes], pos: number }

  function weightOf(i) {
    const s = statusOf(i);
    return REVIEW_WEIGHTS[s === "learning" ? "learning" : s === "known" ? "known" : "new"];
  }

  // Weighted shuffle: cards with more copies left are more likely to come next,
  // and the same card never appears twice in a row (when avoidable).
  function buildReviewQueue() {
    const counts = VOCAB[currentTopic].map((_, i) => weightOf(i));
    const queue = [];
    let last = -1;
    let left = counts.reduce((a, b) => a + b, 0);
    while (left > 0) {
      let pool = counts.map((c, i) => [i, c]).filter(([i, c]) => c > 0 && i !== last);
      if (!pool.length) pool = counts.map((c, i) => [i, c]).filter(([, c]) => c > 0);
      const total = pool.reduce((sum, [, c]) => sum + c, 0);
      let r = Math.random() * total;
      let pick = pool[pool.length - 1][0];
      for (const [i, c] of pool) {
        r -= c;
        if (r < 0) { pick = i; break; }
      }
      queue.push(pick);
      counts[pick]--;
      left--;
      last = pick;
    }
    return queue;
  }

  function updateReviewButton() {
    const n = VOCAB[currentTopic].reduce((sum, _, i) => sum + weightOf(i), 0);
    reviewBtn.textContent = "▶ Review " + currentTopic + " (" + n + " cards)";
  }

  function startReview() {
    review = { queue: buildReviewQueue(), pos: 0 };
    grid.hidden = true;
    reviewEl.hidden = false;
    showReviewCard();
  }

  function showReviewCard() {
    if (!review) return;
    if (review.pos >= review.queue.length) return finishReview();

    const i = review.queue[review.pos];
    reviewCount.textContent = "Card " + (review.pos + 1) + " of " + review.queue.length;
    reviewBox.innerHTML = "";
    const slot = buildSlot(VOCAB[currentTopic][i], i, {
      toggle: () => {
        slot.classList.toggle("open");
        slot.querySelector(".card").classList.toggle("flipped");
      },
      know: () => reviewMark(i, "known"),
      learn: () => reviewMark(i, "learning")
    });
    reviewBox.appendChild(slot);
    slot.querySelector(".card").focus({ preventScroll: true });
  }

  function reviewMark(i, result) {
    saveResult(i, result);
    // Known now? Then skip this card's remaining copies in this session.
    if (result === "known") {
      const done = review.queue.slice(0, review.pos + 1);
      const rest = review.queue.slice(review.pos + 1).filter(x => x !== i);
      review.queue = done.concat(rest);
    }
    review.pos++;
    showReviewCard();
  }

  function finishReview() {
    const total = VOCAB[currentTopic].length;
    showToast("Review done! You know " + knownCount() + " of " + total + " words ✨");
    renderCards(); // back to the grid, re-sorted
  }

  let toastTimer;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 2800);
  }

  document.getElementById("reset").addEventListener("click", () => {
    if (!confirm("Clear your progress for all topics?")) return;
    progress = {};
    saveProgress();
    renderCards(); // also exits review mode
    showToast("Progress cleared. Let's start again!");
  });

  reviewBtn.addEventListener("click", startReview);
  document.getElementById("exitReview").addEventListener("click", renderCards);

  renderTabs();
  renderCards();
</script>
</body>
</html>
