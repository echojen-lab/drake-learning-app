<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sensei – Dashboard</title>
<script>try{var t=localStorage.getItem("sensei-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14B8A6">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sensei">
<style>
  :root {
    --teal: #14B8A6;
    --teal-dark: #0F9E8E;
    --teal-light: #F0FDFA;
    --bg: #F5F5F4;
    --surface: #fff;
    --border: #E7E5E4;
    --track: #E7E5E4;
    --text: #1C1917;
    --muted: #78716C;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 720px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
  }
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 28px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* Welcome */
  .welcome { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .welcome h1 { font-size: 26px; font-weight: 700; }
  .welcome .date { color: var(--muted); font-size: 14px; margin-top: 4px; }

  /* Stat cards */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 14px 12px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .stat .icon { font-size: 18px; }
  .stat .value { font-size: 28px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat .label { font-size: 13px; color: var(--muted); }

  /* Section */
  h2 { font-size: 17px; font-weight: 700; margin-bottom: 10px; }

  /* Continue learning */
  .continue { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .go {
    display: flex; align-items: center; gap: 12px;
    padding: 16px; border-radius: 16px; text-decoration: none;
    font-weight: 600; font-size: 15px;
  }
  .go svg { flex: none; }
  .go.primary { background: var(--teal); color: #fff; }
  .go.primary:hover { background: var(--teal-dark); }
  .go.secondary { background: var(--surface); color: var(--teal-dark); border: 1px solid var(--teal); }
  .go.secondary:hover { background: var(--teal-light); }

  /* Progress chart */
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 16px;
  }
  .rows { display: flex; flex-direction: column; gap: 14px; }
  .row { position: relative; }
  .row-top {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 14px; margin-bottom: 6px;
  }
  .row-top .topic { font-weight: 600; }
  .row-top .count { color: var(--muted); font-variant-numeric: tabular-nums; }
  .track {
    height: 12px; background: var(--track); border-radius: 4px; overflow: hidden;
  }
  .fill {
    height: 100%; width: 0; background: var(--teal); border-radius: 4px;
    transition: width 0.8s ease;
  }
  .row:hover .fill { background: var(--teal-dark); }
  .tip {
    position: absolute; right: 0; top: -30px;
    background: var(--text); color: #fff; font-size: 12px;
    padding: 4px 8px; border-radius: 6px; white-space: nowrap;
    opacity: 0; pointer-events: none; transition: opacity 0.15s;
  }
  .row:hover .tip, .row:focus-within .tip { opacity: 1; }
  .empty-hint { font-size: 13px; color: var(--muted); margin-top: 14px; }
  .empty-hint a { color: var(--teal-dark); }

  @media (max-width: 420px) {
    .stat .value { font-size: 24px; }
    .continue { grid-template-columns: 1fr; }
  }

  /* Navigation: bottom tab bar on mobile, top bar on wider screens */
  .tabbar { display: flex; background: var(--surface); border-top: 1px solid var(--border); }
  .tabbar a {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
    font-size: 12px; font-weight: 600; color: var(--muted); text-decoration: none;
  }
  .tabbar a.active { color: var(--teal); }
  @media (min-width: 641px) {
    .tabbar {
      order: -1; justify-content: center; gap: 8px; padding: 8px;
      border-top: none; border-bottom: 1px solid var(--border);
    }
    .tabbar a { flex: none; flex-direction: row; gap: 8px; padding: 8px 16px; font-size: 14px; border-radius: 999px; }
    .tabbar a.active { background: var(--teal-light); }
  }
</style>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="app">
  <main class="content">
    <section class="welcome">
      <div>
        <h1>Welcome back! 👋</h1>
        <p class="date" id="date"></p>
      </div>
      <span data-theme-toggle></span>
    </section>

    <section class="stats" aria-label="Your stats">
      <div class="stat">
        <span class="icon" aria-hidden="true">📚</span>
        <span class="value" id="statWords">0</span>
        <span class="label">Words Learned</span>
      </div>
      <div class="stat">
        <span class="icon" aria-hidden="true">💬</span>
        <span class="value" id="statChats">0</span>
        <span class="label">Conversations</span>
      </div>
      <div class="stat">
        <span class="icon" aria-hidden="true">🔥</span>
        <span class="value" id="statStreak">0</span>
        <span class="label">Day Streak</span>
      </div>
    </section>

    <section>
      <h2>Continue Learning</h2>
      <div class="continue">
        <a class="go primary" href="vocab.html">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="15" height="14" rx="2"/><path d="M7 3h13a2 2 0 0 1 2 2v11"/></svg>
          Practice Vocabulary
        </a>
        <a class="go secondary" href="index.html">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Chat with Sensei
        </a>
      </div>
    </section>

    <section id="progress">
      <h2>Vocabulary Progress</h2>
      <div class="card">
        <div class="rows" id="rows"></div>
        <p class="empty-hint" id="emptyHint" hidden>
          No words learned yet. <a href="vocab.html">Start with Greetings!</a>
        </p>
      </div>
    </section>
  </main>

  <nav class="tabbar" data-active="dashboard"></nav>
</div>

<script src="shared.js"></script>
<script>
  document.getElementById("date").textContent = new Date().toLocaleDateString("en-US", {
    weekday: "long", year: "numeric", month: "long", day: "numeric"
  });

  const progress = senseiRead(SENSEI_KEYS.vocab, {});
  const streak = senseiStreak();

  let totalKnown = 0;
  const rows = document.getElementById("rows");

  Object.keys(VOCAB).forEach(topic => {
    const words = VOCAB[topic];
    const known = words.filter(w => progress[topic + "::" + w.en] === "known").length;
    const pct = Math.round((known / words.length) * 100);
    totalKnown += known;

    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `
      <div class="row-top">
        <span class="topic">${topic}</span>
        <span class="count">${known} / ${words.length}</span>
      </div>
      <div class="track" role="progressbar" tabindex="0"
           aria-label="${topic}: ${known} of ${words.length} words known"
           aria-valuemin="0" aria-valuemax="${words.length}" aria-valuenow="${known}">
        <div class="fill" data-pct="${pct}"></div>
      </div>
      <span class="tip">${known} of ${words.length} known · ${pct}%</span>`;
    rows.appendChild(row);
  });

  document.getElementById("statWords").textContent = totalKnown;
  document.getElementById("statChats").textContent = senseiRead(SENSEI_KEYS.sessions, 0);
  document.getElementById("statStreak").textContent = streak;
  document.getElementById("emptyHint").hidden = totalKnown > 0;

  // Animate bars in after first paint
  requestAnimationFrame(() => {
    document.querySelectorAll(".fill").forEach(f => { f.style.width = f.dataset.pct + "%"; });
  });
</script>
</body>
</html>
